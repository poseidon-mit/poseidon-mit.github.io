server {
    listen 80;
    server_name 104.168.145.20;

    root /var/www/poseidon;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name poseidon-mit.com www.poseidon-mit.com;
    return 301 https://poseidon-mit.com$request_uri;
}

server {
    listen 443 ssl;
    server_name poseidon-mit.com www.poseidon-mit.com;

    ssl_certificate     /etc/letsencrypt/live/poseidon-mit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poseidon-mit.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/poseidon;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name talk.poseidon-mit.com hwsrv-1317541.hostwindsdns.com;
    return 301 https://talk.poseidon-mit.com$request_uri;
}

server {
    listen 443 ssl;
    server_name talk.poseidon-mit.com;

    ssl_certificate     /etc/letsencrypt/live/talk.poseidon-mit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talk.poseidon-mit.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1 {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
